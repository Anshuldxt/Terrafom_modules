name: Terraform CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  terraform-ci:
    name: Terraform Validation Pipeline
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # TRUFFLEHOG
      # ============================================================
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: .
          version: 3.96.0
          extra_args: --results=verified,unknown,unverified --fail-on-scan-errors

      # ============================================================
      # TERRAFORM
      # ============================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: dev/parent
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: dev/parent
        run: terraform validate

      # ============================================================
      # TFLINT
      # ============================================================
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Version
        run: tflint --version

      - name: TFLint Init
        working-directory: dev/parent
        run: tflint --init

      - name: Run TFLint
        working-directory: dev/parent
        run: tflint

      # ============================================================
      # TFSEC
      # ============================================================
      - name: Run tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: dev/parent

      # ============================================================
      # CHECKOV
      # ============================================================
      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: dev/parent
          framework: terraform
          output_format: sarif
          log_level: WARNING
          container_user: 0

      # ============================================================
      # GITLEAKS
      # ============================================================
      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.0